<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1024" viewBox="0 0 2048 1024">
  <defs>
    <style>
      .skin{fill:#efc29d;stroke:#352d36;stroke-width:8;stroke-linejoin:round;stroke-linecap:round}
      .hair{fill:#9d4c32;stroke:#352d36;stroke-width:8;stroke-linejoin:round}
      .jacket{fill:#b88a50;stroke:#352d36;stroke-width:9;stroke-linejoin:round;stroke-linecap:round}
      .shirt{fill:#397b72;stroke:#352d36;stroke-width:7;stroke-linejoin:round}
      .denim{fill:#35556d;stroke:#352d36;stroke-width:7}
      .shoe{fill:#2b3037;stroke:#352d36;stroke-width:7}
      .line{fill:none;stroke:#352d36;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
      .eye{fill:#352d36}
      .brow{fill:none;stroke:#352d36;stroke-width:8;stroke-linecap:round}
      .motion{fill:none;stroke:#d15e3e;stroke-width:8;stroke-linecap:round}
      .mouthopen{fill:#6b3640;stroke:#352d36;stroke-width:7}
      .camera{fill:#303842;stroke:#352d36;stroke-width:7;stroke-linejoin:round}
      .lens{fill:#75a9b8;stroke:#352d36;stroke-width:7}
    </style>
    <g id="body">
