      <circle class="hair" cx="190" cy="104" r="48"/><circle class="hair" cx="235" cy="74" r="54"/><circle class="hair" cx="288" cy="74" r="54"/><circle class="hair" cx="329" cy="111" r="47"/>
      <path class="hair" d="M171 128 Q180 64 247 62 Q319 58 342 133 Q312 111 292 124 Q264 90 236 124 Q205 103 171 128 Z"/>
      <path class="brow" d="M206 143 Q225 133 240 143"/><path class="brow" d="M272 143 Q291 133 307 143"/>
