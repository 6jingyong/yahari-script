name: Sync from Google Drive

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: Commit message for Drive changes
        required: false
        default: Sync Google Drive workspace

permissions:
  contents: write
  actions: write

concurrency:
  group: google-drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID || '1K0jzA4zaq_nt2gTqPhg6id3zUSyZE3-r' }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.6'
          cache: npm

      - name: Install Drive client
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth

      - name: Download Google Drive project
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "${GDRIVE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::Missing repository secret GDRIVE_SERVICE_ACCOUNT_JSON."
            echo "::error::See .github/DRIVE_SYNC.md for the one-time setup."
            exit 1
          fi

          STAGE="$RUNNER_TEMP/drive-project"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          python .github/drive-sync/sync_from_google_drive.py \
            --folder-id "$DRIVE_FOLDER_ID" \
            --destination "$STAGE"

          test -f "$STAGE/package.json" || { echo "::error::Drive folder is missing package.json"; exit 1; }
          test -f "$STAGE/package-lock.json" || { echo "::error::Drive folder is missing package-lock.json"; exit 1; }
          test -f "$STAGE/apps/editor/index.html" || { echo "::error::Drive folder is missing apps/editor/index.html"; exit 1; }

      - name: Mirror Drive into repository
        run: |
          STAGE="$RUNNER_TEMP/drive-project"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='out/' \
            --exclude='.sites-runtime/' \
            --exclude='.env' \
            --exclude='.env.*' \
            "$STAGE/" "$GITHUB_WORKSPACE/"

          echo "Drive mirror result:"
          git status --short

      - name: Stop if nothing changed
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Drive changes to commit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install project dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Verify synchronized project
        if: steps.changes.outputs.changed == 'true'
        run: npm run check

      - name: Commit and push verified changes
        if: steps.changes.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "${COMMIT_MESSAGE:-Sync Google Drive workspace}"

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main

          NEW_SHA="$(git rev-parse HEAD)"
          echo "Synced commit: \`$NEW_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger normal Verify and Pages deployment
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run verify.yml --ref main
          echo "Triggered the normal Verify workflow for the new main commit." >> "$GITHUB_STEP_SUMMARY"
