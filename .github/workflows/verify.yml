name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.6'
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.6'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-static.mjs
      - name: Configure Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v6
      - name: Pages setup required
        if: steps.pages.outcome != 'success'
        run: |
          echo "GitHub Pages is not enabled yet."
          echo "After the repository is public, open Settings > Pages and set Source to GitHub Actions once." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - name: Deploy Pages
        if: steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
