name: Deploy Pages

on:
  workflow_run:
    workflows: ["Verify"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
      - name: Confirm this is still the current main head
        id: current
        run: |
          git fetch origin main --depth=1
          if [ "$(git rev-parse origin/main)" = "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; skip this stale verified revision." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.current.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.6'
          cache: npm
      - if: steps.current.outputs.deploy == 'true'
        run: npm ci
      - if: steps.current.outputs.deploy == 'true'
        run: npm run build
      - if: steps.current.outputs.deploy == 'true'
        run: node scripts/build-static.mjs
      - name: Configure Pages
        if: steps.current.outputs.deploy == 'true'
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Pages setup required
        if: steps.current.outputs.deploy == 'true' && steps.pages.outcome != 'success'
        run: |
          echo "GitHub Pages is not enabled yet."
          echo "Open Settings > Pages and set Source to GitHub Actions once. Future verified commits will deploy automatically." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Pages artifact
        if: steps.current.outputs.deploy == 'true' && steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: out
      - name: Deploy
        if: steps.current.outputs.deploy == 'true' && steps.pages.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
