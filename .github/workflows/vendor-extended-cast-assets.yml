name: Vendor Extended Cast Assets

on:
  push:
    paths:
      - '.github/workflows/vendor-extended-cast-assets.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned extended cast sprites
        run: |
          set -euo pipefail
          root='https://raw.githubusercontent.com/crxtrdude/pywright/a71527b62c072d89c84054b0674b3a65e1227c48/data/art/port'
          dir='content-packs/courtroom-demo/assets'
          curl -fL "$root/klavier/normal%28blink%29.png" -o "$dir/klavier-normal.png"
          curl -fL "$root/klavier/fist%28blink%29.png" -o "$dir/klavier-fist.png"
          curl -fL "$root/klavier/laughs%28blink%29.png" -o "$dir/klavier-laugh.png"
          curl -fL "$root/klavier/damage.png" -o "$dir/klavier-damaged.png"
          curl -fL "$root/skye/normal%28blink%29.png" -o "$dir/ema-normal.png"
          curl -fL "$root/skye/science%28blink%29.png" -o "$dir/ema-science.png"
          curl -fL "$root/skye/smug%28blink%29.png" -o "$dir/ema-smug.png"
          curl -fL "$root/skye/mad%28blink%29.png" -o "$dir/ema-mad.png"
          curl -fL "$root/skye/surprised%28blink%29.png" -o "$dir/ema-surprised.png"
          curl -fL "$root/trucy/normal%28blink%29.png" -o "$dir/trucy-normal.png"
          curl -fL "$root/trucy/pumped%28blink%29.png" -o "$dir/trucy-cheer.png"
          curl -fL "$root/trucy/thoughtful%28blink%29.png" -o "$dir/trucy-think.png"
          curl -fL "$root/trucy/sad%28blink%29.png" -o "$dir/trucy-sad.png"
          curl -fL "$root/trucy/surprised%28blink%29.png" -o "$dir/trucy-surprised.png"
      - name: Record provenance hashes
        run: |
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {readFileSync,writeFileSync} from 'node:fs';
          const commit='a71527b62c072d89c84054b0674b3a65e1227c48';
          const files=[
            ['klavier-normal.png','klavier','normal(blink).png'],
            ['klavier-fist.png','klavier','fist(blink).png'],
            ['klavier-laugh.png','klavier','laughs(blink).png'],
            ['klavier-damaged.png','klavier','damage.png'],
            ['ema-normal.png','skye','normal(blink).png'],
            ['ema-science.png','skye','science(blink).png'],
            ['ema-smug.png','skye','smug(blink).png'],
            ['ema-mad.png','skye','mad(blink).png'],
            ['ema-surprised.png','skye','surprised(blink).png'],
            ['trucy-normal.png','trucy','normal(blink).png'],
            ['trucy-cheer.png','trucy','pumped(blink).png'],
            ['trucy-think.png','trucy','thoughtful(blink).png'],
            ['trucy-sad.png','trucy','sad(blink).png'],
            ['trucy-surprised.png','trucy','surprised(blink).png'],
          ];
          const path='content-packs/courtroom-demo/assets/sources.json';
          const data=JSON.parse(readFileSync(path,'utf8'));
          for(const [file,dir,sourceName] of files){
            const bytes=readFileSync('content-packs/courtroom-demo/assets/'+file);
            const sha256=createHash('sha256').update(bytes).digest('hex');
            const source='https://github.com/crxtrdude/pywright/blob/'+commit+'/data/art/port/'+dir+'/'+sourceName;
            const next={file,source,sha256};
            const i=data.assets.findIndex(asset=>asset.file===file);
            if(i>=0)data.assets[i]=next;else data.assets.push(next);
          }
          writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          NODE
      - name: Commit vendored assets and remove one-shot importer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-packs/courtroom-demo/assets
          git rm .github/workflows/vendor-extended-cast-assets.yml
          git commit -m "Vendor pinned extended courtroom cast assets"
          git push
